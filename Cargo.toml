[package]
name = "commit-report"
# bump เลขนี้ใน PR เพื่อออก release ตอน merge เข้า main
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "สรุป commit ของตัวเองจากทุก git repo ใต้ root แยกตามวัน และแยกเป็น [ui]/[service]"
repository = "https://github.com/sanapisit/commit-report"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
