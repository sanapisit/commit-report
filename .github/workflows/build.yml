name: build

# ใช้ร่วมกันระหว่าง ci.yml (ทุก PR) และ release.yml (ตอน merge)
# test แล้ว build binary ทุก target เก็บไว้เป็น artifact ชื่อตาม target
on:
  workflow_call:
    inputs:
      ref:
        description: commit ที่จะ build (ว่าง = ref ของ event)
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux_arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: darwin_amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: darwin_arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows_amd64, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows_arm64, ext: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir dist
          cp "target/${{ matrix.target }}/release/commit-report${{ matrix.ext }}" \
            "dist/commit-report_${{ matrix.name }}${{ matrix.ext }}"
      # binary ที่ build บน runner ตรง arch ลองรันได้เลย (darwin_amd64 รันผ่าน Rosetta)
      - name: smoke test
        run: |
          bin="dist/commit-report_${{ matrix.name }}${{ matrix.ext }}"
          "$bin" -version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "$bin" -mcp | grep -q commit_report
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 7
