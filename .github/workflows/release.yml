name: release

# main รับเฉพาะ merge จาก PR ดังนั้นทุก push เข้า main คือการ merge
# ออก release ตาม version ใน Cargo.toml ถ้ามี tag v<version> อยู่แล้ว (ไม่ได้ bump version) จะข้าม
# ใช้ push แทน pull_request: closed เพราะ PR จาก fork ได้ token แบบอ่านอย่างเดียว สร้าง release ไม่ได้
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

env:
  SHA: ${{ github.sha }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: version
        id: version
        run: |
          version=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "ไม่พบ version ใน Cargo.toml"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "มี v$version แล้ว ไม่ออก release (bump version ใน Cargo.toml ใน PR เพื่อออก release ใหม่)"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.tag
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > checksums.txt
      # gh release สร้าง tag ที่ merge commit ให้เอง
      - run: gh release create "${{ needs.version.outputs.tag }}" dist/* --target "$SHA" --generate-notes
