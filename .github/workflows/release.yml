name: release

# PR ถูก merge เข้า main แล้ว ออก release ตาม version ใน Cargo.toml
# ถ้ามี tag v<version> อยู่แล้ว (ไม่ได้ bump version ใน PR นี้) จะข้าม
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency: release

env:
  SHA: ${{ github.event.pull_request.merge_commit_sha }}
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: version
        id: version
        run: |
          version=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "ไม่พบ version ใน Cargo.toml"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "มี v$version แล้ว ไม่ออก release (bump version ใน Cargo.toml ใน PR เพื่อออก release ใหม่)"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.tag
        uses: dtolnay/rust-toolchain@stable
      - if: steps.version.outputs.tag
        run: cargo test --locked

  build:
    needs: version
    if: needs.version.outputs.tag
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux_arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: darwin_amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: darwin_arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows_amd64, ext: .exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows_arm64, ext: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir dist
          cp "target/${{ matrix.target }}/release/commit-report${{ matrix.ext }}" \
            "dist/commit-report_${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > checksums.txt
      # gh release สร้าง tag ที่ merge commit ให้เอง
      - run: gh release create "${{ needs.version.outputs.tag }}" dist/* --target "$SHA" --generate-notes
